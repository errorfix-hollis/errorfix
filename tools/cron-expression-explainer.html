<label for="cron-in">Cron expression <small>(minute hour day-of-month month day-of-week)</small></label>
<input type="text" id="cron-in" value="*/15 9-17 * * MON-FRI" spellcheck="false" autocomplete="off" class="big">
<div class="row presets">
<button class="sec" data-cron="* * * * *">every minute</button><button class="sec" data-cron="*/5 * * * *">every 5 min</button><button class="sec" data-cron="0 * * * *">hourly</button><button class="sec" data-cron="0 0 * * *">daily</button><button class="sec" data-cron="30 2 * * 1-5">weekdays 02:30</button><button class="sec" data-cron="0 0 * * 0">weekly</button><button class="sec" data-cron="0 0 1 * *">monthly</button><button class="sec" data-cron="@reboot">@reboot</button>
</div>
<div id="cron-msg" class="msg" hidden></div>
<p class="result" id="cron-desc"></p>
<h3>Next 5 runs <small>(your time zone: <span id="cron-tz"></span>)</small></h3>
<ol id="cron-next" class="runs"></ol>
